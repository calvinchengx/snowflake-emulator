<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Snowflake Emulator">
  <!-- The same ❄ the landing page carries as an inline data: URI, and the same
       accent (#1f6fb2), so the two surfaces read as one site in a tab strip.
       Drawn as paths rather than a <text>❄</text> glyph: a glyph renders only
       where the font has it, and a favicon is exactly where that degrades
       silently to a blank square. Reasoning from data-agent-service 9c280e5,
       which fixed the same thing. -->
  <rect width="100" height="100" rx="18" fill="#1f6fb2"/>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"><path d="M50 16V84"/><path d="M20.6 33 79.4 67"/><path d="M20.6 67 79.4 33"/><path d="M50 30 41 24M50 30 59 24M50 70 41 76M50 70 59 76"/></g>
</svg>
