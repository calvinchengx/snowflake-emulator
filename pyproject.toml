[project]
name = "snowflake-emulator-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
sdk = ["snowflake-connector-python>=4.2,<5"]
sql = ["snowflake-connector-python>=4.2,<5"]
# dbt-core PINNED BELOW 2, and that is a fidelity constraint rather than
# caution. This lock resolved dbt-core 2.0.0b1 -- a PRERELEASE -- which turns
# dbt's generic-test argument deprecations into hard errors and refuses
# projects a real account accepts. Snowflake's dbt Projects run dbt 1.9.4 by
# default, so an emulator running a 2.0 beta is stricter than the thing it
# stands in for: contoso-data-product's gold parsed on every other engine and
# failed with 11 DbtYamlValidationError here.
dbt = ["dbt-snowflake>=1.8,<2", "dbt-core>=1.9,<2"]
target = [
    "snowflake-target",
    "pytest>=8.3,<10",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false
# sqlparse reaches this lock ONLY through dbt-core, which declares
# `sqlparse<0.6.0`. Four advisories (GHSA-prg7-hcfm-mfcr, GHSA-pwgv-4x5q-6m9f,
# GHSA-f2ff-p2ww-7p4p, GHSA-3496-9g83-7v6x) all name 0.6.0 as the first patched
# version, so no dbt release exists to upgrade INTO that takes a fixed
# sqlparse. A constraint cannot resolve this -- narrowing cannot satisfy
# `<0.6.0` and `>=0.6.0` at once -- so the upper bound has to be overridden.
#
# Deliberate deviation, measured rather than assumed: dbt uses sqlparse in one
# place (`dbt/compilation.py`), and `inject_ctes_into_sql` returns
# byte-identical output under 0.5.5 and 0.6.0. e2e-dbt runs real dbt from this
# lock and is the local check.
#
# Re-check when dbt-core relaxes the bound: DELETE this override then rather
# than leave it quietly pinning the ecosystem.
override-dependencies = ["sqlparse>=0.6.0"]

[tool.uv.sources]
snowflake-target = { path = "python/snowflake-target" }

[tool.ruff]
line-length = 100
target-version = "py312"
