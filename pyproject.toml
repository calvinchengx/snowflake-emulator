[project]
name = "snowflake-emulator-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
sdk = ["snowflake-connector-python>=3.12,<4"]
sql = ["snowflake-connector-python>=3.12,<4"]
dbt = ["dbt-snowflake>=1.8,<2"]
target = ["snowflake-target", "pytest>=8.3,<10"]

[tool.uv]
package = false

[tool.uv.sources]
snowflake-target = { path = "python/snowflake-target" }
