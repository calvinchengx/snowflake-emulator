name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'scripts/assemble_site.py'
      - 'scripts/check_landing.py'
      - 'scripts/check_site_links.py'
      - 'website/published-routes.txt'
      - 'Makefile'
      - 'docs/**'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # Pull requests build the site as a check. Build only: the deploy job
  # is skipped below.
  pull_request:
    paths:
      - 'scripts/assemble_site.py'
      - 'scripts/check_landing.py'
      - 'scripts/check_site_links.py'
      - 'website/published-routes.txt'
      - 'Makefile'
      - 'docs/**'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR builds get their own group so they cannot cancel a queued main deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the parity-version generator reads the map at each
      # `v*` tag (git show) and stamps the live map from `git describe`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      # ONE STEP, AND IT IS THE ONE A DEVELOPER RUNS. `make docs-serve` builds
      # with this same target and then serves the result at the paths it
      # publishes under, so what is previewed locally is what deploys from
      # here. Spelling the sequence out in YAML instead is how the two drift:
      # the local recipe is the one nobody updates, and it is also the only one
      # anyone looks at before pushing. The two `cp` lines this replaces had no
      # local equivalent at all.
      #
      # What it runs, and why each part is not redundant, is documented at the
      # target in the Makefile. In short: the Starlight build; the assembler,
      # which lays the landing page over the docs AND writes a redirect stub
      # for every one of the 30 URLs this site published before #64 moved the
      # base, held to `website/published-routes.txt` as its oracle; the landing
      # page's counts against docs/parity.md; and every internal link in the
      # ASSEMBLED tree, which is the check that catches a base path updated in
      # one file out of three.
      - run: make docs-build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
