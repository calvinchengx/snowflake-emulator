name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # Pull requests build the site as a check. Build only: the deploy job
  # is skipped below.
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR builds get their own group so they cannot cancel a queued main deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the parity-version generator reads the map at each
      # `v*` tag (git show) and stamps the live map from `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter snowflake-emulator-docs build
      # The published site is the landing page at the root with the rendered
      # docs beneath it, so `/` is the project's front door and every chapter
      # lives under `/docs/`. The landing page needs no build: it is one
      # self-contained file, and publishing it is a copy.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp -R website/dist _site/docs
      # The page states counts that docs/parity.md measures. Nothing else
      # watches a number written by hand.
      - name: The landing page agrees with the parity table
        run: python3 scripts/check_landing.py
      # AFTER assembly, because the assembled tree is what is served. A link
      # from the landing page into the docs is only resolvable once both
      # halves sit in one directory, and the docs' base path moved when they
      # did -- which is the change that 404s silently if it is got wrong.
      - name: Every internal link resolves
        run: python3 scripts/check_site_links.py --site _site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
