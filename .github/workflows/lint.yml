# ruff and ty, as their own workflow.
#
# Neither ran here before. ruff had no configuration at all in this repo, and
# turning it on found real defects rather than style noise: an f-string with no
# placeholders, unused imports, and in snowflake-emulator a dict key defined
# twice whose first definition was dead text contradicting the live one.
#
# ty runs inside a SYNCED environment, which is not a detail. Unresolved
# imports mask everything downstream of them, so checking without the
# dependencies installed reports fewer problems, not more, and reads as health.
name: Lint

on:
  push:
    branches: [main]
    paths:
      # EVERYTHING IS CODE UNTIL PROVEN PROSE. `'**'` first, then the prose
      # carved out of it -- so a file nobody anticipated runs the full suite
      # rather than silently skipping it. The failure direction matters more
      # than the saving: running CI on a README costs a minute, and not
      # running it on a source file costs a release.
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!docs/**'
      - '!website/**'
      # ...EXCEPT THESE TWO, WHICH ARE OUTPUTS RATHER THAN PROSE. Both are
      # generated by e2e/parity/run.py, and the `parity` job exists precisely
      # to fail when they disagree with what the emulator actually answers.
      # Letting them ride in as "docs" would mean a hand-edited parity table
      # merges unchecked -- the exact claim this repository makes about
      # itself, quietly false. A later pattern overrides an earlier one, which
      # is what puts them back in scope.
      - 'docs/parity.md'
      - 'docs/witnesses.json'
  pull_request:
    paths:
      # EVERYTHING IS CODE UNTIL PROVEN PROSE. `'**'` first, then the prose
      # carved out of it -- so a file nobody anticipated runs the full suite
      # rather than silently skipping it. The failure direction matters more
      # than the saving: running CI on a README costs a minute, and not
      # running it on a source file costs a release.
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!docs/**'
      - '!website/**'
      # ...EXCEPT THESE TWO, WHICH ARE OUTPUTS RATHER THAN PROSE. Both are
      # generated by e2e/parity/run.py, and the `parity` job exists precisely
      # to fail when they disagree with what the emulator actually answers.
      # Letting them ride in as "docs" would mean a hand-edited parity table
      # merges unchecked -- the exact claim this repository makes about
      # itself, quietly false. A later pattern overrides an earlier one, which
      # is what puts them back in scope.
      - 'docs/parity.md'
      - 'docs/witnesses.json'

permissions:
  contents: read

jobs:
  lint:
    name: ruff and ty
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default, where
    # 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: ruff
        run: uvx ruff@0.15.22 check .

      - name: ty
        run: uv run --frozen --group sdk --group sql --group dbt --group target --with ty ty check
