name: CI

on:
  push:
    branches: [main]
    paths:
      # EVERYTHING IS CODE UNTIL PROVEN PROSE. `'**'` first, then the prose
      # carved out of it -- so a file nobody anticipated runs the full suite
      # rather than silently skipping it. The failure direction matters more
      # than the saving: running CI on a README costs a minute, and not
      # running it on a source file costs a release.
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!docs/**'
      - '!website/**'
      # site/ is the landing page, and its numbers ARE guarded -- by
      # scripts/check_landing.py, which runs in docs-site.yml, the very
      # workflow a site/ change triggers. The two trigger sets are
      # complementary rather than overlapping: nothing reaches main
      # without the check that reads it having run.
      - '!site/**'
      # ...EXCEPT THESE TWO, WHICH ARE OUTPUTS RATHER THAN PROSE. Both are
      # generated by e2e/parity/run.py, and the `parity` job exists precisely
      # to fail when they disagree with what the emulator actually answers.
      # Letting them ride in as "docs" would mean a hand-edited parity table
      # merges unchecked -- the exact claim this repository makes about
      # itself, quietly false. A later pattern overrides an earlier one, which
      # is what puts them back in scope.
      - 'docs/parity.md'
      - 'docs/witnesses.json'
  pull_request:
    paths:
      # EVERYTHING IS CODE UNTIL PROVEN PROSE. `'**'` first, then the prose
      # carved out of it -- so a file nobody anticipated runs the full suite
      # rather than silently skipping it. The failure direction matters more
      # than the saving: running CI on a README costs a minute, and not
      # running it on a source file costs a release.
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!docs/**'
      - '!website/**'
      # site/ is the landing page, and its numbers ARE guarded -- by
      # scripts/check_landing.py, which runs in docs-site.yml, the very
      # workflow a site/ change triggers. The two trigger sets are
      # complementary rather than overlapping: nothing reaches main
      # without the check that reads it having run.
      - '!site/**'
      # ...EXCEPT THESE TWO, WHICH ARE OUTPUTS RATHER THAN PROSE. Both are
      # generated by e2e/parity/run.py, and the `parity` job exists precisely
      # to fail when they disagree with what the emulator actually answers.
      # Letting them ride in as "docs" would mean a hand-edited parity table
      # merges unchecked -- the exact claim this repository makes about
      # itself, quietly false. A later pattern overrides an earlier one, which
      # is what puts them back in scope.
      - 'docs/parity.md'
      - 'docs/witnesses.json'

permissions:
  contents: read

jobs:
  changes:
    name: Is this change documentation only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # Full history: the classifier diffs against the base, which a depth-1
      # checkout cannot see.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Beside the real classification, every time. A classifier that stopped
      # matching would answer `false` forever: safe, plausible, and silently
      # useless. The cases are the only thing that would notice.
      - run: python3 scripts/docs_only_change.py --self-test
      - id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A force push and a branch's first commit both give the null sha.
          # Neither is a docs change; both run everything.
          if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "base '$BASE' is not a commit here; running everything"
            exit 0
          fi
          git diff --name-status "$BASE...$HEAD_SHA" | python3 scripts/docs_only_change.py

  test:
    name: Build, vet & tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Matches databricks-emulator: unformatted Go fails the build rather
      # than accumulating until someone notices.
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      # `make test` needs the duckdb CLI, and this job said it did not.
      # TestATaskBodyIsASnowflakeStatement proves a task body reaches the
      # ENGINE correctly -- that a stream reference expands and COPY INTO is
      # rewritten before duckdb sees them -- so it cannot be proved without
      # duckdb. It passed locally only because a developer machine has it on
      # PATH, which is the same way e2e-put learned this one job over.
      #
      # Installed rather than skipped when absent: a test that skips itself
      # keeps the job green while proving nothing, and this one is the only
      # thing standing between a task body and silently running the wrong
      # statement.
      - name: Install duckdb CLI
        # RETRIED, because a bare download is a coin flip eight times a run.
        # `curl: (35) Recv failure: Connection reset by peer` failed the dbt
        # job on a dependabot PR that only bumped an action SHA -- a red that
        # said nothing about the change under review, on a step every job here
        # repeats. --retry covers the transient statuses; --retry-connrefused
        # and --retry-all-errors are what cover a reset mid-transfer, which is
        # the one that actually happened.
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused --retry-all-errors \
            -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: make test

  # Its own job, as in arm-, keyvault-, entra- and apim-emulator. It was three
  # steps at the end of `test`, which meant the docs checks could only run by
  # running the whole Go build -- so gating `test` on a docs-only change would
  # have skipped the two checks a docs change is the only thing that can break.
  # Ungated for that reason: a renamed witness or a moved page is found here.
  witnesses:
    name: Every parity claim names its witness, and every doc link resolves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
      - run: python3 scripts/check_witnesses.py
      # The site build does NOT catch a dangling intra-doc link: measured, it
      # exits 0 and publishes a 404. Nor can it see a page missing from the
      # sidebar, which is published but unreachable by navigation.
      - run: python3 scripts/check_docs_links.py --strict

  e2e-sdk:
    name: Official connectors auth
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
      - run: uv run --frozen --group sdk python e2e/sdk/run.py

  e2e-sql:
    name: DuckDB-named warehouse SQL
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
