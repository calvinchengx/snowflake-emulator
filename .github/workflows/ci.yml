        # `curl: (35) Recv failure: Connection reset by peer` failed the dbt
        # job on a dependabot PR that only bumped an action SHA -- a red that
        # said nothing about the change under review, on a step every job here
        # repeats. --retry covers the transient statuses; --retry-connrefused
        # and --retry-all-errors are what cover a reset mid-transfer, which is
        # the one that actually happened.
