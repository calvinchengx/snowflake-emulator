name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, vet & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Matches databricks-emulator: unformatted Go fails the build rather
      # than accumulating until someone notices.
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: make test
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"
      - run: python3 scripts/check_witnesses.py
      # The site build does NOT catch a dangling intra-doc link: measured, it
      # exits 0 and publishes a 404. Nor can it see a page missing from the
      # sidebar, which is published but unreachable by navigation.
      - run: python3 scripts/check_docs_links.py --strict

  e2e-sdk:
    name: Official connectors auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"
      - run: uv run --frozen --group sdk python e2e/sdk/run.py

  e2e-sql:
    name: DuckDB-named warehouse SQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"
      - name: Install duckdb CLI
        run: |
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group sql python e2e/sql/run.py

  e2e-put:
    name: PUT uploads through the driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"
      # The duckdb CLI IS needed, and the first version of this job said it
      # was not. The connector moves the bytes, but COPY INTO and the SELECT
      # that counts the rows run through the warehouse, which is duckdb. It
      # passed locally only because a developer machine has it on PATH.
      - name: Install duckdb CLI
        run: |
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group sql python e2e/put/run.py

  e2e-tasks:
    name: TASK_HISTORY answers what a graph did
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"
      - name: Install duckdb CLI
        run: |
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group sql python e2e/tasks/run.py

  e2e-iceberg:
    name: Iceberg REST list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"
      - name: Install duckdb CLI
        run: |
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group sql python e2e/iceberg/run.py

  e2e-dbt:
    name: Unmodified dbt-snowflake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"
      - name: Install duckdb CLI
        run: |
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group dbt python e2e/dbt/run.py

  e2e-snowflake-target:
    name: snowflake-target toggle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
        with:
          version: "0.12.3"
      - name: Install duckdb CLI
        run: |
          curl -fsSL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: uv run --frozen --group target pytest python/snowflake-target/tests -q
      - run: uv run --frozen --group target python e2e/target/run.py

  parity:
    name: parity.md is measured, not written
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      # NO `Install duckdb CLI` STEP, and that is the point. This probe runs
      # against the built IMAGE, whose duckdb is the one the Dockerfile pins.
      # The pinned CLI exits 0 after refusing a statement where a newer one
      # exits 1, so a probe run against a host build reports honest failures
      # the shipped image does not give -- which is how a silent 200 survived
      # a day of measurement.
      - run: uv run --frozen --group sql python e2e/parity/run.py --check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default, where
    # 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Gated at zero. .golangci.yml excludes unchecked Close, Rollback and
      # Fprintf, where the return value is unactionable at the call site;
      # everything surviving that is fixed rather than suppressed. Its issue
      # caps are lifted too, since by default identical issues stop at three
      # and that under-reported this family by 2.5x.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
