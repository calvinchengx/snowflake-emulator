          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group dbt python e2e/dbt/run.py

  e2e-snowflake-target:
    name: snowflake-target toggle
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
      - name: Install duckdb CLI
        # RETRIED, because a bare download is a coin flip eight times a run.
        # `curl: (35) Recv failure: Connection reset by peer` failed the dbt
        # job on a dependabot PR that only bumped an action SHA -- a red that
        # said nothing about the change under review, on a step every job here
        # repeats. --retry covers the transient statuses; --retry-connrefused
        # and --retry-all-errors are what cover a reset mid-transfer, which is
        # the one that actually happened.
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused --retry-all-errors \
            -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: uv run --frozen --group target pytest python/snowflake-target/tests -q
      # The path filters decide whether the rest of this file runs at all,
      # and a wrong one fails by being silent. See tests/test_workflow_paths.py.
      - run: uv run --frozen --group target pytest tests -q
      - run: uv run --frozen --group target python e2e/target/run.py

  parity:
    name: parity.md is measured, not written
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      # NO `Install duckdb CLI` STEP, and that is the point. This probe runs
      # against the built IMAGE, whose duckdb is the one the Dockerfile pins.
      # The pinned CLI exits 0 after refusing a statement where a newer one
      # exits 1, so a probe run against a host build reports honest failures
      # the shipped image does not give -- which is how a silent 200 survived
      # a day of measurement.
      - run: uv run --frozen --group sql python e2e/parity/run.py --check

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default, where
    # 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Gated at zero. .golangci.yml excludes unchecked Close, Rollback and
      # Fprintf, where the return value is unactionable at the call site;
      # everything surviving that is fixed rather than suppressed. Its issue
      # caps are lifted too, since by default identical issues stop at three
      # and that under-reported this family by 2.5x.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
