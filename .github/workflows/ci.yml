  e2e-iceberg:
    name: Iceberg REST list
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
      - name: Install duckdb CLI
        # RETRIED, because a bare download is a coin flip eight times a run.
        # `curl: (35) Recv failure: Connection reset by peer` failed the dbt
        # job on a dependabot PR that only bumped an action SHA -- a red that
