          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group sql python e2e/sql/run.py

  e2e-put:
    name: PUT uploads through the driver
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
      # The duckdb CLI IS needed, and the first version of this job said it
      # was not. The connector moves the bytes, but COPY INTO and the SELECT
      # that counts the rows run through the warehouse, which is duckdb. It
      # passed locally only because a developer machine has it on PATH.
      - name: Install duckdb CLI
        # RETRIED, because a bare download is a coin flip eight times a run.
        # `curl: (35) Recv failure: Connection reset by peer` failed the dbt
        # job on a dependabot PR that only bumped an action SHA -- a red that
        # said nothing about the change under review, on a step every job here
        # repeats. --retry covers the transient statuses; --retry-connrefused
        # and --retry-all-errors are what cover a reset mid-transfer, which is
        # the one that actually happened.
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused --retry-all-errors \
            -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group sql python e2e/put/run.py

  e2e-tasks:
    name: TASK_HISTORY answers what a graph did
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
      - name: Install duckdb CLI
        # RETRIED, because a bare download is a coin flip eight times a run.
        # `curl: (35) Recv failure: Connection reset by peer` failed the dbt
        # job on a dependabot PR that only bumped an action SHA -- a red that
        # said nothing about the change under review, on a step every job here
        # repeats. --retry covers the transient statuses; --retry-connrefused
        # and --retry-all-errors are what cover a reset mid-transfer, which is
        # the one that actually happened.
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused --retry-all-errors \
            -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip
          sudo unzip -o /tmp/duckdb.zip -d /usr/local/bin
      - run: uv run --frozen --group sql python e2e/tasks/run.py

  e2e-infer:
    name: A table built from INFER_SCHEMA loads the file
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.3"
